services:
  mysql:
    image: mysql:8.0
    container_name: delivery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-delivery_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    container_name: delivery-migrate
    env_file: [.env]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["poetry","run","alembic","upgrade","head"]
    restart: "no"

  web:
    build: .
    container_name: delivery-web
    env_file: [.env]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./log_config.yaml:/app/log_config.yaml:ro
    command:
      [
        "poetry","run","uvicorn","delivery_service.main:app",
        "--host","0.0.0.0","--port","8000",
        "--workers","5",
        "--log-config","/app/log_config.yaml"
      ]

  scheduler:
    build: .
    container_name: delivery-scheduler
    env_file: [.env]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./log_config.yaml:/app/log_config.yaml:ro
    command: ["poetry","run","python","-m","delivery_service.tasks.scheduler"]
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

[tool.poetry]
name = "delivery-service"
version = "1.0.0"
description = "International delivery microservice"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
sqlalchemy = {extras = ["mypy"], version = "^2.0.45"}
redis = "^5.2.0"
apscheduler = "^3.11.2"
httpx = "^0.28.0"
alembic = "^1.18.0"
asyncmy = "^0.2.10"
cryptography = "^46.0.3"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.10.0"
mypy = "^1.14.0"
pre-commit = "^4.0.0"
types-redis = "^4.6.0.20241004"
aiosqlite = "^0.22.1"
types-pyyaml = "^6.0.12.20250915"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["delivery_service"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
  "integration: tests that require running service (docker, mysql, redis)",
]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

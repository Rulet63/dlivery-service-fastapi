version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: default

root:
  level: INFO
  handlers: [console]

loggers:
  delivery_service:
    level: DEBUG
    propagate: true

  apscheduler:
    level: WARNING
    propagate: true

  uvicorn:
    level: INFO
    propagate: true
  uvicorn.error:
    level: INFO
    propagate: true
  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: false
